name: Deploy Quartz site to Codeberg Pages

on:
  push:
    branches:
      - v4
  workflow_dispatch:

concurrency:
  group: "codeberg-pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Build Quartz
        run: npx quartz build

      - name: Add extensionless URL support
        run: |
          find public -type f -name "*.html" ! -name "index.html" | while read file; do
            target="${file%.html}"
            if [ ! -e "$target" ]; then
              mkdir -p "$target"
              cp "$file" "$target/index.html"
            fi
          done

      - name: Deploy to Codeberg Pages branch
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          cd public
          git init
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "Deploy Codeberg Pages"
          git branch -M pages
          git remote add codeberg https://Gioppo:${CODEBERG_TOKEN}@codeberg.org/Gioppo/notte-inquieta-sfera-di-chrono-quartz.git
          git push --force codeberg pages
